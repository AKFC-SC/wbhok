name: SportMonks 35-Fixture Diagnostic (TEMPORARY)

# TEMPORARY, READ-ONLY DIAGNOSTIC WORKFLOW.
#
# Purpose: print a compact team-id mapping — ENGLISH ONLY, no locale=ar —
# for a FIXED, pre-verified list of 35 fixture ids, one line per
# fixture: fixture_id | home_team_id | home_team_name | away_team_id |
# away_team_name. The ids are the linking keys; names are informational
# only and are never used for matching. Arabic team names/logos/city/
# stadium come from the Team CMS in Webflow (keyed by
# sportsmonks-team-id), never from SportMonks' Arabic translation.
#
# This workflow does NOT import or call sync.py, does NOT reference
# WEBFLOW_API_TOKEN (or any Webflow credential) anywhere, and makes
# ZERO requests to the Webflow API. The only requests it makes are HTTP
# GETs to the SportMonks API. It never creates, updates, or publishes
# anything. No translation dictionary is used and no matching by team
# name is performed. It is manually triggered only — no schedule, no
# push trigger. Intended to be deleted after use.

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Print compact team mapping (English only) for 35 fixed ids
        env:
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKENS }}
        run: |
          python3 - <<'PYEOF'
          import os
          import time

          import requests

          # Fixed, pre-verified list — do not add/remove ids here without
          # re-running the Webflow eligibility check this list came from.
          FIXTURE_IDS = [
              19712052, 19777675, 19777690, 19777692, 19777704, 19777711,
              19778724, 19778731, 19778742, 19778755, 19778760, 19778769,
              19778776, 19778783, 19778811, 19778834, 19778849, 19778863,
              19778879, 19778900, 19778926, 19778934, 19778952, 19778967,
              19778993, 19779009, 19779029, 19779054, 19779065, 19779090,
              19779102, 19779125, 19779145, 19779165, 19880098,
          ]

          SM_BASE = "https://api.sportmonks.com/v3/football"

          token = os.environ["SPORTSMONKS_API_TOKEN"]


          def fetch_mapping(fixture_id):

              # No 'locale' param at all — English/default response only.
              response = requests.get(
                  f"{SM_BASE}/fixtures/{fixture_id}",
                  params={
                      "api_token": token,
                      "include": "participants",
                  },
                  timeout=30,
              )

              # Never print the request URL (it carries the token as a
              # query parameter) — only the status code.
              if not response.ok:
                  raise RuntimeError(f"HTTP {response.status_code}")

              data = response.json().get("data") or {}

              participants = data.get("participants") or []

              home = next(
                  (
                      p for p in participants
                      if (p.get("meta") or {}).get("location") == "home"
                  ),
                  None,
              )
              away = next(
                  (
                      p for p in participants
                      if (p.get("meta") or {}).get("location") == "away"
                  ),
                  None,
              )

              if not home or not away:
                  raise RuntimeError("home/away participant missing")

              return (
                  data.get("id"),
                  home.get("id"),
                  home.get("name"),
                  away.get("id"),
                  away.get("name"),
              )


          lines = []
          successful = 0
          failed = 0

          for fixture_id in FIXTURE_IDS:

              try:
                  fid, hid, hname, aid, aname = fetch_mapping(fixture_id)
                  lines.append(f"{fid} | {hid} | {hname} | {aid} | {aname}")
                  successful += 1

              except Exception as err:
                  # Never guess: record the id and the real failure reason,
                  # then continue to the rest of the fixtures.
                  lines.append(f"{fixture_id} | ERROR: {err}")
                  failed += 1

              # Be polite to the API between fixtures.
              time.sleep(0.3)

          print("::group::fixture_id | home_team_id | home_team_name | away_team_id | away_team_name")
          for line in lines:
              print(line)
          print("::endgroup::")

          print()
          print("successful_fetches:", successful)
          print("failed_fetches:", failed)
          PYEOF

      - name: Confirm scope and safety properties
        run: |
          echo "Locale used: English only (no locale=ar, no Arabic endpoint call)"
          echo "HTTP methods used: GET only, SportMonks API only"
          echo "Webflow calls: 0"
          echo "Webflow writes: 0"
          echo "Webflow publishes: 0"
          echo "sync.py imported: NO"
          echo "Production sync invoked: NO"
          echo "Translation dictionary used: NO"
          echo "Matched by team name: NO (raw team ids only)"
          echo "Scope: 35 fixed, pre-verified fixture ids only"
